<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>사진 관리 | 환경보건이용권 관리자</title>
    <link rel="stylesheet" href="../../assets/css/normalize.css" />
    <link rel="stylesheet" href="../../assets/css/pretendard.css" />
    <link rel="stylesheet" href="../../assets/css/responsive.css" />
  </head>
  <body class="page-photo page-flow nav-current-consulting">
    <div id="wrap">
      <a class="skip-nav" href="#content">본문 바로가기</a>
      <header class="app-header"></header>
      <main id="container">
        <div class="page-title"><h2>진단 컨설팅 사업 운영 관리</h2></div>
        <div class="page-content" id="content">
          <select class="select-input project-select" aria-label="사업 선택">
            <option>진단 컨설팅</option>
          </select>
          <nav class="page-tabs" aria-label="진단 컨설팅 작성 단계">
            <a href="household_survey_register.html">가구점검 설문지 작성</a>
            <a href="field_inspection_register.html">현장점검표 작성</a>
            <a class="is-active" href="photo_manage.html" aria-current="page">사진 관리</a>
            <a href="#">점검결과 보고서</a>
          </nav>
          <div class="section-divider"></div>
          <form enctype="multipart/form-data">
            <section class="form-section">
              <h3 class="form-section__title">기본정보</h3>
              <div class="detail-list">
                <div class="detail-row">
                  <div class="detail-row__label">관리번호</div>
                  <div class="detail-row__value">202600000016</div>
                </div>
                <div class="detail-row">
                  <div class="detail-row__label">신청인 성명</div>
                  <div class="detail-row__value">홍길동</div>
                </div>
              </div>
            </section>

            <section class="photo-row-section photo-upload-section">
              <h3 class="photo-row-title">사진등록</h3>
              <div class="photo-row-content">
                <p class="form-section__notice">※ 외부전경, 어린이방, 취약구역 사진 촬영 필수</p>
                <div class="upload-actions">
                  <label class="file-button">
                    사진 찍기
                    <input
                      class="js-photo-source"
                      id="cameraPhotoInput"
                      type="file"
                      accept="image/*"
                      capture="environment"
                    />
                  </label>
                  <label class="file-button">
                    사진 보관함
                    <input class="js-photo-source" id="libraryPhotoInput" type="file" accept="image/*" />
                  </label>
                </div>
                <ul class="upload-list" id="photoUploadList" aria-live="polite" hidden></ul>
                <button
                  class="btn btn--upload-all btn--full"
                  id="uploadAllPhotos"
                  type="button"
                  aria-controls="photoUploadList photoGallery"
                  hidden
                >
                  일괄 업로드
                </button>
              </div>
            </section>

            <section class="photo-row-section photo-info-section">
              <h3 class="photo-row-title">사진정보</h3>
              <div class="photo-gallery photo-gallery--empty" id="photoGallery" aria-live="polite">
                <div class="empty-state">등록된 사진이 없습니다.</div>
              </div>
            </section>
            <div class="button-group">
              <a class="btn btn--secondary" href="consulting_operation_list.html">목록</a>
              <button class="btn btn--light-blue" type="button">임시저장</button>
              <button class="btn btn--primary" type="submit">등록</button>
            </div>
          </form>
        </div>
      </main>
      <footer class="app-footer"></footer>
    </div>
    <script src="../../assets/js/jquery-3.4.1.min.js"></script>
    <script src="../../assets/js/jquery-ui.min.js"></script>
    <script src="../../assets/js/simplebar.min.js"></script>
    <script src="../../assets/js/swiper.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/pikaday.js"></script>
    <script src="../../assets/js/inputmask.js"></script>
    <script src="../../assets/js/toastify-js.js"></script>
    <script src="../../assets/js/responsive.js"></script>
    <script src="../../assets/js/photo-manage.js"></script>
  </body>
</html>
