<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>실내환경 개선결과 상세 | 환경보건이용권 관리자</title>
    <link rel="stylesheet" href="../../assets/css/normalize.css" />
    <link rel="stylesheet" href="../../assets/css/pretendard.css" />
    <link rel="stylesheet" href="../../assets/css/pikaday.css" />
    <link rel="stylesheet" href="../../assets/css/responsive.css" />
  </head>
  <body class="page-result-detail page-flow nav-current-consulting">
    <div id="wrap">
      <a class="skip-nav" href="#content">본문 바로가기</a>
      <header class="app-header"></header>
      <main id="container">
        <div class="page-title"><h2>실내환경 개선결과 상세</h2></div>
        <div class="page-content" id="content">
          <select class="select-input project-select" aria-label="업무 선택">
            <option>실내환경 개선결과</option>
          </select>
          <div class="section-divider"></div>
          <form>
            <section class="form-section">
              <h3 class="form-section__title">시공대상자 정보</h3>
              <div class="detail-list">
                <div class="detail-row">
                  <label class="detail-row__label" for="constructionTarget">대상자</label>
                  <div class="detail-row__value">
                    <input class="text-input" id="constructionTarget" type="text" />
                  </div>
                </div>
                <div class="detail-row">
                  <label class="detail-row__label" for="constructionPhone">연락처</label>
                  <div class="detail-row__value">
                    <input class="text-input" id="constructionPhone" type="tel" />
                  </div>
                </div>
                <div class="detail-row detail-row--wide">
                  <span class="detail-row__label">주소</span>
                  <div class="detail-row__value address-fields">
                    <input class="text-input" type="text" aria-label="기본 주소" />
                    <input class="text-input" type="text" aria-label="상세 주소" />
                  </div>
                </div>
                <div class="detail-row">
                  <label class="detail-row__label" for="constructionArea">시공면적</label>
                  <div class="detail-row__value">
                    <div class="input-with-unit">
                      <input class="text-input" id="constructionArea" type="text" inputmode="decimal" />
                      <span>㎡</span>
                    </div>
                  </div>
                </div>
                <div class="detail-row">
                  <label class="detail-row__label" for="constructionDate">시공일</label>
                  <div class="detail-row__value">
                    <input
                      class="text-input date-input datepicker"
                      id="constructionDate"
                      type="text"
                      placeholder="YYYY-MM-DD"
                    />
                    <p class="required-message">필수 입력 항목입니다.</p>
                  </div>
                </div>
                <div class="detail-row detail-row--wide">
                  <div class="detail-row__label">동의여부</div>
                  <div class="detail-row__value choice-list">
                    <label class="choice">
                      <input type="radio" name="agreement" checked />
                      동의함
                    </label>
                    <label class="choice">
                      <input type="radio" name="agreement" />
                      동의하지 않음
                    </label>
                  </div>
                </div>
                <div class="detail-row">
                  <label class="detail-row__label" for="constructionCompany">시공업체명</label>
                  <div class="detail-row__value">
                    <input class="text-input" id="constructionCompany" type="text" />
                  </div>
                </div>
                <div class="detail-row">
                  <label class="detail-row__label" for="constructorName">시공자</label>
                  <div class="detail-row__value">
                    <input class="text-input" id="constructorName" type="text" />
                  </div>
                </div>
                <div class="detail-row detail-row--wide">
                  <div class="detail-row__label">실내환경 개선항목</div>
                  <div class="detail-row__value detail-row__value--stack">
                    <div class="choice-list">
                      <label class="choice">
                        <input type="radio" name="improvementItem" checked />
                        벽지, 장판 교체
                      </label>
                      <label class="choice">
                        <input type="radio" name="improvementItem" />
                        보일러 교체
                      </label>
                      <label class="choice">
                        <input type="radio" name="improvementItem" />
                        경보수
                      </label>
                      <label class="choice">
                        <input id="improvementItemEtc" type="radio" name="improvementItem" value="etc" />
                        기타
                      </label>
                    </div>
                    <input
                      class="text-input"
                      id="improvementItemEtcText"
                      type="text"
                      placeholder="기타 개선항목을 입력하세요."
                      aria-label="기타 개선항목"
                      readonly
                    />
                  </div>
                </div>
              </div>
            </section>

            <section class="form-section construction-section">
              <h3 class="form-section__title">시공 정보</h3>
              <div class="construction-list">
                <article class="construction-card">
                  <h4 class="construction-card__title">벽지 시공</h4>
                  <div class="construction-option">
                    <div class="construction-option__label">시공여부</div>
                    <div class="choice-list">
                      <label class="choice">
                        <input type="radio" name="wallWork" checked />
                        O
                      </label>
                      <label class="choice">
                        <input type="radio" name="wallWork" />
                        X
                      </label>
                    </div>
                  </div>
                  <div class="construction-subsection">
                    <h5>현장사진</h5>
                    <div class="photo-fields">
                      <div class="photo-field">
                        <div class="photo-field__title">개선 전</div>
                        <label class="file-button">
                          파일 선택
                          <input class="js-file-input" type="file" accept="image/*" />
                        </label>
                        <div class="photo-preview photo-preview--empty">등록된 사진이 없습니다.</div>
                      </div>
                      <div class="photo-field">
                        <div class="photo-field__title">개선 후</div>
                        <label class="file-button">
                          파일 선택
                          <input class="js-file-input" type="file" accept="image/*" />
                        </label>
                        <div class="photo-preview photo-preview--empty">등록된 사진이 없습니다.</div>
                      </div>
                    </div>
                  </div>
                  <div class="construction-subsection">
                    <h5>사용자재 정보</h5>
                    <div class="material-info">
                      <div>
                        <label class="field-label" for="wallCompany">회사명</label>
                        <input class="text-input" id="wallCompany" type="text" />
                      </div>
                      <div>
                        <label class="field-label" for="wallModel">모델명</label>
                        <input class="text-input" id="wallModel" type="text" />
                      </div>
                      <div>
                        <label class="field-label" for="wallAmount">사용량</label>
                        <input class="text-input" id="wallAmount" type="text" inputmode="decimal" />
                      </div>
                    </div>
                  </div>
                </article>

                <article class="construction-card">
                  <h4 class="construction-card__title">바닥재 시공</h4>
                  <div class="construction-option">
                    <div class="construction-option__label">시공여부</div>
                    <div class="choice-list">
                      <label class="choice">
                        <input type="radio" name="floorWork" checked />
                        O
                      </label>
                      <label class="choice">
                        <input type="radio" name="floorWork" />
                        X
                      </label>
                    </div>
                  </div>
                  <div class="construction-subsection">
                    <h5>현장사진</h5>
                    <div class="photo-fields">
                      <div class="photo-field">
                        <div class="photo-field__title">개선 전</div>
                        <label class="file-button">
                          파일 선택
                          <input class="js-file-input" type="file" accept="image/*" />
                        </label>
                        <div class="photo-preview photo-preview--empty">등록된 사진이 없습니다.</div>
                      </div>
                      <div class="photo-field">
                        <div class="photo-field__title">개선 후</div>
                        <label class="file-button">
                          파일 선택
                          <input class="js-file-input" type="file" accept="image/*" />
                        </label>
                        <div class="photo-preview photo-preview--empty">등록된 사진이 없습니다.</div>
                      </div>
                    </div>
                  </div>
                  <div class="construction-subsection">
                    <h5>사용자재 정보</h5>
                    <div class="material-info">
                      <div>
                        <label class="field-label" for="floorCompany">회사명</label>
                        <input class="text-input" id="floorCompany" type="text" />
                      </div>
                      <div>
                        <label class="field-label" for="floorModel">모델명</label>
                        <input class="text-input" id="floorModel" type="text" />
                      </div>
                      <div>
                        <label class="field-label" for="floorAmount">사용량</label>
                        <input class="text-input" id="floorAmount" type="text" inputmode="decimal" />
                      </div>
                    </div>
                  </div>
                </article>
              </div>
            </section>
            <div class="button-group">
              <a class="btn btn--secondary" href="improvement_result_list.html">목록</a>
              <button class="btn btn--light-blue" type="button">임시저장</button>
              <button class="btn btn--primary" type="submit">등록</button>
            </div>
          </form>
        </div>
      </main>
      <footer class="app-footer"></footer>
    </div>
    <script src="../../assets/js/jquery-3.4.1.min.js"></script>
    <script src="../../assets/js/jquery-ui.min.js"></script>
    <script src="../../assets/js/simplebar.min.js"></script>
    <script src="../../assets/js/swiper.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/pikaday.js"></script>
    <script src="../../assets/js/inputmask.js"></script>
    <script src="../../assets/js/toastify-js.js"></script>
    <script src="../../assets/js/responsive.js"></script>
    <script>
      (function () {
        "use strict";

        var improvementItemRadios = document.querySelectorAll('input[name="improvementItem"]');
        var improvementItemEtc = document.getElementById("improvementItemEtc");
        var improvementItemEtcText = document.getElementById("improvementItemEtcText");

        function syncImprovementItemEtc() {
          var isEnabled = improvementItemEtc.checked;
          improvementItemEtcText.readOnly = !isEnabled;
          if (!isEnabled) improvementItemEtcText.value = "";
        }

        improvementItemRadios.forEach(function (radio) {
          radio.addEventListener("change", syncImprovementItemEtc);
        });
        syncImprovementItemEtc();
      })();
    </script>
  </body>
</html>
