<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="format-detection" content="telephone=no" />
    <title>로그인 | 환경보건이용권 관리자</title>
    <link rel="stylesheet" href="../../assets/css/normalize.css" />
    <link rel="stylesheet" href="../../assets/css/pretendard.css" />
    <link rel="stylesheet" href="../../assets/css/responsive.css" />
  </head>
  <body>
    <div class="login-page">
      <main class="login-main">
        <section class="login-card" aria-labelledby="loginTitle">
          <h1 class="login-card__title" id="loginTitle">
            <span>환경보건이용권</span>
            <span>관리자 로그인</span>
          </h1>
          <form class="login-form" action="">
            <div class="login-form__fields">
              <label class="sr-only" for="login_id">아이디</label>
              <input
                class="text-input"
                id="login_id"
                type="text"
                autocomplete="username"
                placeholder="아이디를 입력하세요."
              />
              <label class="sr-only" for="login_password">비밀번호</label>
              <input
                class="text-input"
                id="login_password"
                type="password"
                autocomplete="current-password"
                placeholder="비밀번호를 입력하세요."
              />
            </div>
            <div class="login-form__options">
              <label class="choice">
                <input type="checkbox" />
                아이디 저장
              </label>
            </div>
            <button class="login-submit js-login-submit" type="button">로그인</button>
          </form>
        </section>
      </main>
      <footer class="login-footer">
        <span>
          Ⓒ
          <strong>KEITI</strong>
          ALL RIGHTS RESERVED.
        </span>
        <span>Version&nbsp;1.0.0</span>
      </footer>

      <div class="auth-layer" aria-hidden="true" hidden>
        <div class="auth-layer__dim"></div>
        <section
          class="auth-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="authTitle"
          aria-describedby="authDescription"
          tabindex="-1"
        >
          <div class="auth-dialog__body">
            <header class="auth-dialog__header">
              <h2 class="auth-dialog__eyebrow" id="authTitle">2단계 인증</h2>
              <p class="auth-dialog__title" id="authDescription">
                <strong>문자메시지로 전송된</strong><br />
                <strong>인증번호</strong>를 입력해 주세요.
              </p>
            </header>

            <div class="auth-dialog__input-row">
              <div class="auth-dialog__input-wrap">
                <label class="sr-only" for="auth_code">인증번호</label>
                <input
                  class="auth-dialog__input"
                  id="auth_code"
                  type="text"
                  inputmode="numeric"
                  autocomplete="one-time-code"
                  maxlength="6"
                  placeholder="인증번호 입력"
                />
                <span class="auth-dialog__timer js-auth-timer" aria-live="polite">03:00</span>
              </div>
              <button class="auth-dialog__resend js-auth-resend" type="button">재전송</button>
            </div>

            <ul class="auth-dialog__guide">
              <li>입력시간 내 인증번호(6자리)를 입력해 주세요.</li>
              <li>인증번호가 도착하지 않을 경우 재전송 버튼을 눌러주세요.</li>
            </ul>
          </div>

          <div class="auth-dialog__actions">
            <button class="auth-dialog__button auth-dialog__button--cancel js-auth-cancel" type="button">취소</button>
            <button class="auth-dialog__button auth-dialog__button--confirm js-auth-confirm" type="button">인증</button>
          </div>
        </section>
      </div>
    </div>

    <script src="../../assets/js/jquery-3.4.1.min.js"></script>
    <script src="../../assets/js/jquery-ui.min.js"></script>
    <script src="../../assets/js/simplebar.min.js"></script>
    <script src="../../assets/js/swiper.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/pikaday.js"></script>
    <script src="../../assets/js/inputmask.js"></script>
    <script src="../../assets/js/toastify-js.js"></script>
    <script src="../../assets/js/responsive.js"></script>
  </body>
</html>
